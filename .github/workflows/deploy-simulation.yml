name: Deploy Project Marine Alchemist Multimodal Engine

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true  # Aborts old building tasks if you push new updates rapidly

jobs:
  deploy-twin:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages Environment Configurations
        uses: actions/configure-pages@v5

      - name: Asset Pre-Compression Matrix (Optimization Layer)
        run: |
          echo "Optimizing static WebGL index assets..."
          # Compresses the standalone engine layout for high-speed edge distribution
          if [ -f index.html ]; then
            gzip -k -9 index.html
            echo "Gzip asset optimization completed."
          fi

      - name: Upload Static WebGL Asset Bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Stream Production Build to Live GitHub Pages Node
        id: deployment
        uses: actions/deploy-pages@v4
